<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1090" width="1300" height="1090"
     font-family="Segoe UI, Verdana, Arial, sans-serif">

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>

  <style>
    .title{font-size:26px;font-weight:700;fill:#1e293b}
    .subtitle{font-size:13px;fill:#475569}
    .card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
    .modebadge{font-size:15px;font-weight:700;fill:#ffffff}
    .modetitle{font-size:14px;font-weight:700;fill:#1e293b}
    .boxlabel{font-size:13px;font-weight:700;fill:#ffffff}
    .postag{font-size:10px;font-style:italic;fill:#64748b}
    .desc{font-size:12px;fill:#334155}
    .legend{font-size:12px;fill:#334155}
  </style>

  <!-- background -->
  <rect x="0" y="0" width="1300" height="1090" fill="#ffffff"/>

  <!-- Title -->
  <text x="650" y="38" text-anchor="middle" class="title">BitTorrent Tracker Editor — Console Tracker Order Modes (-U0 to -U7)</text>
  <text x="650" y="60" text-anchor="middle" class="subtitle">How NEW trackers (add_trackers.txt) combine with ORIGINAL trackers already inside each torrent file</text>

  <!-- Legend -->
  <text x="30" y="100" class="legend" font-weight="700">Legend:</text>

  <rect x="110" y="88" width="60" height="20" rx="3" fill="#2563eb" stroke="#1e40af"/>
  <text x="180" y="103" class="legend">NEW trackers (from add_trackers.txt)</text>

  <rect x="480" y="88" width="60" height="20" rx="3" fill="#059669" stroke="#047857"/>
  <text x="550" y="103" class="legend">ORIGINAL trackers (already in the torrent)</text>

  <rect x="890" y="88" width="60" height="20" rx="3" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,3"/>
  <text x="960" y="103" class="legend">INTACT (kept whole &amp; in order)</text>

  <text x="110" y="132" class="legend" fill="#b91c1c">✂ dupes removed</text>
  <text x="230" y="132" class="legend">= duplicates stripped from this list only</text>

  <line x1="480" y1="127" x2="530" y2="127" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="540" y="132" class="legend">BEGIN → END (write order inside the torrent file)</text>

  <rect x="960" y="118" width="130" height="20" rx="4" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="1025" y="132" text-anchor="middle" class="legend" font-size="10" font-weight="700" fill="#1d4ed8">ALL FILES COMBINED</text>

  <!-- ================= U0 ================= -->
  <g>
    <rect class="card" x="30" y="170" width="600" height="210" rx="10"/>
    <rect x="45" y="182" width="55" height="26" rx="5" fill="#334155"/>
    <text x="72" y="200" text-anchor="middle" class="modebadge">-U0</text>
    <text x="110" y="200" class="modetitle">New trackers first — NEW kept intact</text>

    <text x="180" y="220" text-anchor="middle" font-size="9" font-weight="700" fill="#b45309">INTACT</text>
    <rect x="50" y="225" width="260" height="36" rx="4" fill="#2563eb" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,3"/>
    <text x="180" y="248" text-anchor="middle" class="boxlabel">NEW</text>
    <text x="180" y="275" text-anchor="middle" class="postag">BEGIN</text>

    <line x1="310" y1="243" x2="350" y2="243" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="480" y="220" text-anchor="middle" font-size="9" font-weight="700" fill="#b91c1c">✂ DUPES REMOVED</text>
    <rect x="350" y="225" width="260" height="36" rx="4" fill="#059669" stroke="#047857" stroke-width="1.5"/>
    <text x="480" y="248" text-anchor="middle" class="boxlabel">ORIGINAL</text>
    <text x="480" y="275" text-anchor="middle" class="postag">END</text>

    <text x="50" y="298" class="desc">
      <tspan x="50" dy="0">NEW list inserted BEFORE ORIGINAL.</tspan>
      <tspan x="50" dy="14">NEW stays intact at BEGIN; duplicates removed from ORIGINAL.</tspan>
    </text>
  </g>

  <!-- ================= U1 ================= -->
  <g>
    <rect class="card" x="670" y="170" width="600" height="210" rx="10"/>
    <rect x="685" y="182" width="55" height="26" rx="5" fill="#334155"/>
    <text x="712" y="200" text-anchor="middle" class="modebadge">-U1</text>
    <text x="750" y="200" class="modetitle">New trackers first — ORIGINAL kept intact</text>

    <text x="820" y="220" text-anchor="middle" font-size="9" font-weight="700" fill="#b91c1c">✂ DUPES REMOVED</text>
    <rect x="690" y="225" width="260" height="36" rx="4" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <text x="820" y="248" text-anchor="middle" class="boxlabel">NEW</text>
    <text x="820" y="275" text-anchor="middle" class="postag">BEGIN</text>

    <line x1="950" y1="243" x2="990" y2="243" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="1120" y="220" text-anchor="middle" font-size="9" font-weight="700" fill="#b45309">INTACT</text>
    <rect x="990" y="225" width="260" height="36" rx="4" fill="#059669" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,3"/>
    <text x="1120" y="248" text-anchor="middle" class="boxlabel">ORIGINAL</text>
    <text x="1120" y="275" text-anchor="middle" class="postag">END</text>

    <text x="690" y="298" class="desc">
      <tspan x="690" dy="0">NEW list inserted BEFORE ORIGINAL.</tspan>
      <tspan x="690" dy="14">ORIGINAL stays intact at END; duplicates removed from NEW.</tspan>
    </text>
  </g>

  <!-- ================= U2 ================= -->
  <g>
    <rect class="card" x="30" y="400" width="600" height="210" rx="10"/>
    <rect x="45" y="412" width="55" height="26" rx="5" fill="#334155"/>
    <text x="72" y="430" text-anchor="middle" class="modebadge">-U2</text>
    <text x="110" y="430" class="modetitle">Original first — NEW kept intact</text>

    <text x="180" y="450" text-anchor="middle" font-size="9" font-weight="700" fill="#b91c1c">✂ DUPES REMOVED</text>
    <rect x="50" y="455" width="260" height="36" rx="4" fill="#059669" stroke="#047857" stroke-width="1.5"/>
    <text x="180" y="478" text-anchor="middle" class="boxlabel">ORIGINAL</text>
    <text x="180" y="505" text-anchor="middle" class="postag">BEGIN</text>

    <line x1="310" y1="473" x2="350" y2="473" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="480" y="450" text-anchor="middle" font-size="9" font-weight="700" fill="#b45309">INTACT</text>
    <rect x="350" y="455" width="260" height="36" rx="4" fill="#2563eb" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,3"/>
    <text x="480" y="478" text-anchor="middle" class="boxlabel">NEW</text>
    <text x="480" y="505" text-anchor="middle" class="postag">END</text>

    <text x="50" y="528" class="desc">
      <tspan x="50" dy="0">NEW list appended AFTER ORIGINAL.</tspan>
      <tspan x="50" dy="14">NEW stays intact at END; duplicates removed from ORIGINAL.</tspan>
    </text>
  </g>

  <!-- ================= U3 ================= -->
  <g>
    <rect class="card" x="670" y="400" width="600" height="210" rx="10"/>
    <rect x="685" y="412" width="55" height="26" rx="5" fill="#334155"/>
    <text x="712" y="430" text-anchor="middle" class="modebadge">-U3</text>
    <text x="750" y="430" class="modetitle">Original first — ORIGINAL kept intact</text>

    <text x="820" y="450" text-anchor="middle" font-size="9" font-weight="700" fill="#b45309">INTACT</text>
    <rect x="690" y="455" width="260" height="36" rx="4" fill="#059669" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,3"/>
    <text x="820" y="478" text-anchor="middle" class="boxlabel">ORIGINAL</text>
    <text x="820" y="505" text-anchor="middle" class="postag">BEGIN</text>

    <line x1="950" y1="473" x2="990" y2="473" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="1120" y="450" text-anchor="middle" font-size="9" font-weight="700" fill="#b91c1c">✂ DUPES REMOVED</text>
    <rect x="990" y="455" width="260" height="36" rx="4" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <text x="1120" y="478" text-anchor="middle" class="boxlabel">NEW</text>
    <text x="1120" y="505" text-anchor="middle" class="postag">END</text>

    <text x="690" y="528" class="desc">
      <tspan x="690" dy="0">NEW list appended AFTER ORIGINAL.</tspan>
      <tspan x="690" dy="14">ORIGINAL stays intact at BEGIN; duplicates removed from NEW.</tspan>
    </text>
  </g>

  <!-- ================= U4 (special: combined across all files) ================= -->
  <g>
    <rect class="card" x="30" y="630" width="600" height="210" rx="10"/>
    <rect x="45" y="642" width="55" height="26" rx="5" fill="#334155"/>
    <text x="72" y="660" text-anchor="middle" class="modebadge">-U4</text>
    <text x="110" y="660" class="modetitle">Sort combined list (same for every file)</text>
    <rect x="480" y="642" width="130" height="20" rx="4" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="545" y="656" text-anchor="middle" font-size="10" font-weight="700" fill="#1d4ed8">ALL FILES COMBINED</text>

    <rect x="50" y="676" width="140" height="22" rx="3" fill="#2563eb" stroke="#1e40af"/>
    <text x="120" y="691" text-anchor="middle" class="boxlabel" font-size="11">NEW</text>
    <rect x="50" y="702" width="140" height="22" rx="3" fill="#059669" stroke="#047857"/>
    <text x="120" y="717" text-anchor="middle" class="boxlabel" font-size="10">ALL ORIGINALS</text>

    <line x1="190" y1="687" x2="220" y2="687" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="190" y1="713" x2="220" y2="713" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="220" y="676" width="110" height="50" rx="4" fill="#64748b" stroke="#334155"/>
    <text x="275" y="696" text-anchor="middle" class="boxlabel" font-size="11">UNION</text>
    <text x="275" y="710" text-anchor="middle" class="boxlabel" font-size="10">(dedup)</text>

    <line x1="330" y1="701" x2="360" y2="701" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="360" y="676" width="120" height="50" rx="4" fill="#7c3aed" stroke="#5b21b6"/>
    <text x="420" y="696" text-anchor="middle" class="boxlabel" font-size="11">SORTED</text>
    <text x="420" y="710" text-anchor="middle" class="boxlabel" font-size="10">A → Z</text>

    <line x1="480" y1="701" x2="500" y2="701" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="500" y="676" width="100" height="50" rx="4" fill="#334155"/>
    <text x="550" y="696" text-anchor="middle" class="boxlabel" font-size="10">EVERY FILE</text>
    <text x="550" y="710" text-anchor="middle" class="boxlabel" font-size="9">(same list)</text>

    <text x="50" y="755" class="desc">
      <tspan x="50" dy="0">Combines NEW + the UNION of ORIGINAL trackers from ALL</tspan>
      <tspan x="50" dy="14">processed files, removes duplicates, then sorts A→Z. The</tspan>
      <tspan x="50" dy="14">exact same sorted list is written into every torrent file.</tspan>
    </text>
  </g>

  <!-- ================= U5 ================= -->
  <g>
    <rect class="card" x="670" y="630" width="600" height="210" rx="10"/>
    <rect x="685" y="642" width="55" height="26" rx="5" fill="#334155"/>
    <text x="712" y="660" text-anchor="middle" class="modebadge">-U5</text>
    <text x="750" y="660" class="modetitle">New first, nothing removed</text>
    <rect x="1150" y="642" width="110" height="22" rx="4" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="1205" y="657" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">NO REMOVALS</text>

    <text x="820" y="680" text-anchor="middle" font-size="9" font-weight="700" fill="#b91c1c">✂ DUPES REMOVED</text>
    <rect x="690" y="685" width="260" height="36" rx="4" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <text x="820" y="708" text-anchor="middle" class="boxlabel">NEW</text>
    <text x="820" y="735" text-anchor="middle" class="postag">BEGIN</text>

    <line x1="950" y1="703" x2="990" y2="703" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="1120" y="680" text-anchor="middle" font-size="9" font-weight="700" fill="#b45309">INTACT / UNTOUCHED</text>
    <rect x="990" y="685" width="260" height="36" rx="4" fill="#059669" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,3"/>
    <text x="1120" y="708" text-anchor="middle" class="boxlabel">ORIGINAL</text>
    <text x="1120" y="735" text-anchor="middle" class="postag">END</text>

    <text x="690" y="758" class="desc">
      <tspan x="690" dy="0">Same order as -U1 (NEW before ORIGINAL).</tspan>
      <tspan x="690" dy="14">remove_trackers.txt is ignored — nothing is removed;</tspan>
      <tspan x="690" dy="14">each file's own ORIGINAL list stays fully intact.</tspan>
    </text>
  </g>

  <!-- ================= U6 ================= -->
  <g>
    <rect class="card" x="30" y="860" width="600" height="210" rx="10"/>
    <rect x="45" y="872" width="55" height="26" rx="5" fill="#334155"/>
    <text x="72" y="890" text-anchor="middle" class="modebadge">-U6</text>
    <text x="110" y="890" class="modetitle">Original first, nothing removed</text>
    <rect x="510" y="872" width="110" height="22" rx="4" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="565" y="887" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">NO REMOVALS</text>

    <text x="180" y="910" text-anchor="middle" font-size="9" font-weight="700" fill="#b45309">INTACT / UNTOUCHED</text>
    <rect x="50" y="915" width="260" height="36" rx="4" fill="#059669" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,3"/>
    <text x="180" y="938" text-anchor="middle" class="boxlabel">ORIGINAL</text>
    <text x="180" y="965" text-anchor="middle" class="postag">BEGIN</text>

    <line x1="310" y1="933" x2="350" y2="933" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="480" y="910" text-anchor="middle" font-size="9" font-weight="700" fill="#b91c1c">✂ DUPES REMOVED</text>
    <rect x="350" y="915" width="260" height="36" rx="4" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <text x="480" y="938" text-anchor="middle" class="boxlabel">NEW</text>
    <text x="480" y="965" text-anchor="middle" class="postag">END</text>

    <text x="50" y="988" class="desc">
      <tspan x="50" dy="0">Same order as -U3 (ORIGINAL before NEW).</tspan>
      <tspan x="50" dy="14">remove_trackers.txt is ignored — nothing is removed;</tspan>
      <tspan x="50" dy="14">each file's own ORIGINAL list stays fully intact.</tspan>
    </text>
  </g>

  <!-- ================= U7 (special: combined across all files, shuffled) ================= -->
  <g>
    <rect class="card" x="670" y="860" width="600" height="210" rx="10"/>
    <rect x="685" y="872" width="55" height="26" rx="5" fill="#334155"/>
    <text x="712" y="890" text-anchor="middle" class="modebadge">-U7</text>
    <text x="750" y="890" class="modetitle">Randomize combined list (per file)</text>
    <rect x="1120" y="872" width="130" height="20" rx="4" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="1185" y="886" text-anchor="middle" font-size="10" font-weight="700" fill="#1d4ed8">ALL FILES COMBINED</text>

    <rect x="690" y="906" width="140" height="22" rx="3" fill="#2563eb" stroke="#1e40af"/>
    <text x="760" y="921" text-anchor="middle" class="boxlabel" font-size="11">NEW</text>
    <rect x="690" y="932" width="140" height="22" rx="3" fill="#059669" stroke="#047857"/>
    <text x="760" y="947" text-anchor="middle" class="boxlabel" font-size="10">ALL ORIGINALS</text>

    <line x1="830" y1="917" x2="860" y2="917" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="830" y1="943" x2="860" y2="943" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="860" y="906" width="110" height="50" rx="4" fill="#64748b" stroke="#334155"/>
    <text x="915" y="926" text-anchor="middle" class="boxlabel" font-size="11">UNION</text>
    <text x="915" y="940" text-anchor="middle" class="boxlabel" font-size="10">(dedup)</text>

    <line x1="970" y1="931" x2="1000" y2="931" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="1000" y="906" width="120" height="50" rx="4" fill="#7c3aed" stroke="#5b21b6"/>
    <text x="1060" y="926" text-anchor="middle" class="boxlabel" font-size="10">SHUFFLED</text>
    <text x="1060" y="940" text-anchor="middle" class="boxlabel" font-size="9">(random)</text>

    <line x1="1120" y1="931" x2="1140" y2="931" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="1140" y="906" width="100" height="50" rx="4" fill="#334155"/>
    <text x="1190" y="926" text-anchor="middle" class="boxlabel" font-size="10">EACH FILE</text>
    <text x="1190" y="940" text-anchor="middle" class="boxlabel" font-size="9">(own order)</text>

    <text x="690" y="985" class="desc">
      <tspan x="690" dy="0">Uses the same combined union as -U4, but shuffles it</tspan>
      <tspan x="690" dy="14">randomly. Each file gets its own random order, yet every</tspan>
      <tspan x="690" dy="14">file still gets the same combined set of trackers.</tspan>
    </text>
  </g>

  <text x="650" y="1075" text-anchor="middle" class="subtitle">See enduser/readme.txt for the full console mode documentation.</text>

</svg>
